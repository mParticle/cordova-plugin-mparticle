name: Build and Test
on: [workflow_dispatch, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  js-test:
    name: JS Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugin
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: "NPM Build"
        run: npm ci; npm run build --if-present
      - name: "NPM Test"
        run: npm test

  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugin
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install JDK 17"
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 17
      - name: Install NPM
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: NPM Build
        run: |
          npm ci
          npm run build --if-present
      - name: Run Unit Tests
        run: ./gradlew test

  example-android:
    name: Build Example Android App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./example
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 17
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Cordova
        run: npm install -g cordova # zizmor: ignore[adhoc-packages] Avoid a CI-only lockfile.
      - name: Install Dependencies
        run: npm ci
      - name: Add Android Platform
        run: cordova platform add android
      - name: Build Android
        run: cordova build android

  example-ios:
    name: Build Example iOS App
    runs-on: macos-15
    defaults:
      run:
        working-directory: ./example
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install Cordova
        run: npm install -g cordova # zizmor: ignore[adhoc-packages] Avoid a CI-only lockfile.
      - name: Install Dependencies
        run: npm ci
      - name: Add iOS Platform
        run: cordova platform add ios
      - name: Build iOS
        run: cordova build ios --verbose
      # The plugins are Swift packages, so no Podfile should exist. Cordova finds CDVMParticle by
      # name and the Rokt kit registers itself at load time, so a missing class only shows at
      # runtime. Debug builds keep the code in <app>.debug.dylib.
      - name: Check Swift Package Manager linking
        run: |
          test ! -e platforms/ios/Podfile || { echo "::error::A Podfile was generated; a plugin still uses CocoaPods"; exit 1; }
          APP=$(find platforms/ios/build -maxdepth 3 -name '*.app' -type d | head -1)
          [ -d "$APP" ] || { echo "::error::No .app found under platforms/ios/build"; exit 1; }
          SYMBOLS=$(nm -U "$APP"/*.debug.dylib "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" 2>/dev/null || true)
          for class in CDVMParticle MPKitRokt; do
            grep -q "_OBJC_CLASS_\$_${class}\$" <<< "$SYMBOLS" || { echo "::error::$class is not linked into $APP"; exit 1; }
          done

  pr-notify:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    needs:
      - js-test
      - android-test
      - example-android
      - example-ios
    name: Notify GChat
    permissions:
      contents: read
      id-token: write
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@da0c5fd5d38e9cf113a24ec9aaea079cc7d0bc40 # zizmor: ignore[ref-version-mismatch]
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_WEBHOOK }}

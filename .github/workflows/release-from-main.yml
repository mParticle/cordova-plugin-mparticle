name: Release NPM

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions: {}

jobs:
  setup-and-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_version: ${{ steps.version-file.outputs.release-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get current version
        id: version-file
        run: |
          version_from_file=$(head -n 1 VERSION)
          echo "release-version=$version_from_file" >> $GITHUB_OUTPUT

  build-and-release:
    needs: setup-and-version
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install Plugin dependencies
        working-directory: plugin
        run: npm ci

      - name: Test Plugin
        working-directory: plugin
        run: npm test

      - name: Publish Plugin to npm
        working-directory: plugin
        run: npm publish --access public

      - name: Publish Rokt Kit to npm
        working-directory: Kits/Rokt
        run: npm publish --access public

      - name: Publish Rokt Payment Extension to npm
        working-directory: Kits/RoktPaymentExtension
        run: npm publish --access public

      - uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        id: extract-release-notes
        with:
          changelog_file: CHANGELOG.md

      - name: Changelog
        env:
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: echo "$RELEASE_NOTES"

      - name: Create Github release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_VERSION: ${{ needs.setup-and-version.outputs.final_version }}
          RELEASE_NOTES: ${{ steps.extract-release-notes.outputs.release_notes }}
        run: |
          {
            printf '## Release notes:\n%s\n' "$RELEASE_NOTES"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$FINAL_VERSION" \
            --target "$GITHUB_SHA" \
            --title "$FINAL_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
